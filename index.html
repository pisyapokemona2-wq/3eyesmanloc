<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Третий Глаз</title>
  <style>@font-face{font-family:'Press Start 2P';src:url('assets/fonts/PressStart2P-Regular.ttf') format('truetype');font-display:block}canvas#game{image-rendering:pixelated}</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
    canvas { display: block; }
    #touch { display: none; position: fixed; inset: 0; pointer-events: none; user-select: none; -webkit-user-select: none; }
    #touch .b {
      position: absolute; pointer-events: auto; width: 64px; height: 64px; border-radius: 50%;
      background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.35); color: rgba(255,255,255,0.8);
      font: 14px "Press Start 2P", monospace; display: flex; align-items: center; justify-content: center;
    }
    #touch .b.on { background: rgba(154,255,200,0.35); }
    #touch .l { left: 16px; bottom: 30px; } #touch .r { left: 96px; bottom: 30px; }
    #touch .d { left: 56px; bottom: 100px; width: 48px; height: 48px; font-size: 10px; }
    #touch .j { right: 16px; bottom: 30px; } #touch .s { right: 96px; bottom: 60px; }
    #touch .c { right: 30px; bottom: 112px; width: 52px; height: 52px; }
    #touch .v { right: 110px; bottom: 140px; width: 48px; height: 48px; font-size: 10px; }
    #touch .f { right: 180px; bottom: 40px; width: 52px; height: 52px; }
    #touch .p { right: 16px; top: 16px; width: 44px; height: 44px; font-size: 10px; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="touch">
    <div class="b l" data-a="left">◄</div>
    <div class="b r" data-a="right">►</div>
    <div class="b d" data-a="down">▼</div>
    <div class="b j" data-a="jump,confirm">Z</div>
    <div class="b s" data-a="shoot">X</div>
    <div class="b c" data-a="spear">C</div>
    <div class="b v" data-a="special">V</div>
    <div class="b f" data-a="dash">»</div>
    <div class="b p" data-a="pause">II</div>
  </div>
  <script src="src/core.js"></script>
  <script src="src/font.js"></script>
  <script src="src/pix.js"></script>
  <script src="src/art/registry.js"></script>
  <script src="src/art/hero.js"></script>
  <script src="src/art/items.js"></script>
  <script src="src/art/enemies_a.js"></script>
  <script src="src/art/enemies_b.js"></script>
  <script src="src/art/bosses_a.js"></script>
  <script src="src/art/bosses_b.js"></script>
  <script src="src/art/tiles_city.js"></script>
  <script src="src/art/tiles_sewer.js"></script>
  <script src="src/art/tiles_ruins.js"></script>
  <script src="src/art/tiles_cave.js"></script>
  <script src="src/art/tiles_ice.js"></script>
  <script src="src/art/tiles_volcano.js"></script>
  <script src="src/art/tiles_sky.js"></script>
  <script src="src/art/tiles_temple.js"></script>
  <script src="src/art/hazards.js"></script>
  <script src="src/input.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/gfx.js"></script>
  <script src="src/particles.js"></script>
  <script src="src/levels.js"></script>
  <script src="src/world.js"></script>
  <script src="src/tiles.js"></script>
  <script src="src/bg_themes.js"></script>
  <script src="src/backgrounds.js"></script>
  <script src="src/entities.js"></script>
  <script src="src/hazards.js"></script>
  <script src="src/player.js"></script>
  <script src="src/enemies.js"></script>
  <script src="src/bosses.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/game.js"></script>
  <script src="src/main.js"></script>
  <script src="desktop/neu-boot.js"></script>
</body>
</html>
