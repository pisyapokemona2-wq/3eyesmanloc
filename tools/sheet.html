<!doctype html>
<html><head><meta charset="utf-8"><title>Art sheet</title>
<style>body{margin:0;background:#2a2a34;color:#ddd;font:12px monospace} canvas{image-rendering:pixelated;display:block}</style>
</head><body><canvas id="c"></canvas>
<script src="../src/art/registry.js"></script>
<script src="../src/art/manifest.js"></script>
<script>
// Лист спрайтов: ?prefix=e_&scale=4&files=enemies_a.js,enemies_b.js
const q = new URLSearchParams(location.search);
const files = q.get('files') ? q.get('files').split(',') : window.ART_FILES;
const prefix = q.get('prefix') || '';
const scale = +(q.get('scale') || 4);
let loaded = 0;
const missing = [];
files.forEach((f) => {
  const s = document.createElement('script');
  s.src = '../src/art/' + f;
  s.onload = s.onerror = (e) => { if (e.type === 'error') missing.push(f); if (++loaded === files.length) render(); };
  document.body.appendChild(s);
});
if (!files.length) render();
function render() {
  const names = Object.keys(G.Art.defs).filter((n) => n.startsWith(prefix));
  const cv = document.getElementById('c'), c = cv.getContext('2d');
  const W = 1600;
  // раскладка
  let x = 8, y = 8, rowH = 0;
  const pos = [];
  for (const n of names) {
    const s = G.Art.get(n);
    const w = Math.max(s.w * scale, 80), h = s.h * scale + 16;
    if (x + w > W - 8) { x = 8; y += rowH + 10; rowH = 0; }
    pos.push([n, x, y]);
    x += w + 10; rowH = Math.max(rowH, h);
  }
  const errs = G.Art.errors.concat(missing.map((m) => 'нет файла ' + m));
  cv.width = W; cv.height = y + rowH + 20 + errs.length * 14 + 10;
  c.imageSmoothingEnabled = false;
  c.fillStyle = '#2a2a34'; c.fillRect(0, 0, cv.width, cv.height);
  for (const [n, px, py] of pos) {
    const s = G.Art.get(n);
    // шахматка под спрайтом
    for (let yy = 0; yy < s.h; yy++) for (let xx = 0; xx < s.w; xx++) { c.fillStyle = (xx + yy) % 2 ? '#3a3a46' : '#44445a'; c.fillRect(px + xx * scale, py + yy * scale, scale, scale); }
    c.drawImage(s.img, px, py, s.w * scale, s.h * scale);
    // точка привязки
    c.fillStyle = '#ff3060'; c.fillRect(px + s.ox * scale - 1, py + s.oy * scale - 1, 3, 3);
    c.fillStyle = '#cfcfe0'; c.fillText(`${n} ${s.w}x${s.h}`, px, py + s.h * scale + 12);
  }
  c.fillStyle = '#ff7070';
  errs.forEach((e, i) => c.fillText(e, 8, y + rowH + 24 + i * 14));
  document.title = 'done';
}
</script></body></html>
