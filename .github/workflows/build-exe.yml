name: Windows EXE
on:
  workflow_dispatch:
  push:
    branches: ['**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Сборка exe
        run: node tools/build-exe-lite.js
      - name: Выложить в Releases (ссылка всегда одна и та же)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete game --yes --cleanup-tag || true
          gh release create game dist/ThirdEye.exe --target "$GITHUB_SHA" --title "Третий Глаз — последняя сборка" --notes "Скачайте ThirdEye.exe и запустите. Нужен Windows 10/11."
