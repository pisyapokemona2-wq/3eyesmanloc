name: Windows EXE
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Зависимости сборки
        run: |
          mkdir -p .cache && cd .cache
          echo '{"name":"build-cache","version":"1.0.0","private":true}' > package.json
          npm i resedit@2.0.3
      - name: Сборка
        run: node tools/build-exe.js
      - uses: actions/upload-artifact@v4
        with:
          name: ThirdEye-win64
          path: dist/ThirdEye-win64/
